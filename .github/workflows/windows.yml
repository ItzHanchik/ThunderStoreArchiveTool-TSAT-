name: Windows installer and portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/d73b8dfa-thunderstorearchivetool-tsat']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged Windows smoke test
        run: node scripts/desktop-smoke.mjs
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TSAT-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            test-results/windows-desktop.png
          if-no-files-found: error
          retention-days: 30
