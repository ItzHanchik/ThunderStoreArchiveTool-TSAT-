name: Windows installer and portable
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged Windows smoke test
        run: node scripts/desktop-smoke.mjs
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TSAT-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            test-results/windows-desktop.png
          if-no-files-found: error
          retention-days: 30
      - name: Attach verified binaries to an explicitly prepared draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $releaseJson = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No draft release prepared. Binaries remain in workflow artifacts."
            exit 0
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft -or $release.targetCommitish -ne $env:BUILD_SHA) {
            Write-Host "Release does not match this build. No assets changed."
            exit 0
          }
          $assets = @(Get-ChildItem release/*.exe | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path release/SHA256SUMS.txt).Path
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
